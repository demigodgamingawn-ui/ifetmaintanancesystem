<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 75" width="380" height="75">
  <!-- Circular Crest Emblem -->
  <g transform="translate(38, 38)">
    <circle cx="0" cy="0" r="34" fill="#1e1b4b" stroke="#75850b" stroke-width="2" />
    <circle cx="0" cy="0" r="30" fill="#2d2b6b" />
    <circle cx="0" cy="0" r="26" fill="none" stroke="#e2e8f0" stroke-width="0.8" stroke-dasharray="2,2" />
    <!-- Tower / Crest Icon -->
    <path d="M-6,14 L-6,2 L-2,-14 L2,-14 L6,2 L6,14 Z" fill="#849a11" />
    <path d="M-3,14 L-3,4 L0,-8 L3,4 L3,14 Z" fill="#ffffff" />
    <circle cx="0" cy="-15" r="2.5" fill="#f59e0b" />
    <!-- Laurel Wreath Leaves -->
    <path d="M-18,-4 C-22,-12 -16,-22 -6,-25" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
    <path d="M18,-4 C22,-12 16,-22 6,-25" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" />
    <!-- IFET Monogram -->
    <text x="0" y="22" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="10" fill="#ffffff" text-anchor="middle" letter-spacing="1">IFET</text>
  </g>

  <!-- Institution Branding Typography -->
  <g transform="translate(86, 12)">
    <!-- Red Banner with IFET Autonomous -->
    <rect x="0" y="0" width="162" height="25" rx="3" fill="#be123c" />
    <text x="8" y="18" font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="16" fill="#ffffff" letter-spacing="0.5">IFET</text>
    <rect x="56" y="4" width="98" height="17" rx="2" fill="#ffffff" />
    <text x="105" y="16" font-family="'Inter', sans-serif" font-weight="700" font-size="10.5" fill="#be123c" text-anchor="middle" letter-spacing="0.2">Autonomous</text>

    <!-- COLLEGE OF ENGINEERING -->
    <text x="0" y="41" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="12" fill="#1e293b" letter-spacing="0.6">COLLEGE OF ENGINEERING</text>

    <!-- Motto: Discipline • Devotion • Distinction -->
    <text x="0" y="55" font-family="'Inter', serif" font-weight="600" font-style="italic" font-size="8.5" fill="#475569" letter-spacing="0.3">Discipline • Devotion • Distinction</text>
  </g>
</svg>
